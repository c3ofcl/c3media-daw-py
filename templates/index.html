<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マルチトラック音声エディタ</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>🎚️ マルチトラック音声エディタ</h1>
    <div class="time-counter" id="timeCounter">
      <span id="currentTimeLabel" class="current">0:00</span> / <span id="totalTimeLabel">0:00</span>
    </div>
    <div class="toolbar">
      <label class="file-btn">
        + ファイルを追加
        <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      </label>
      <button id="playBtn" class="btn">▶ 再生</button>
      <button id="stopBtn" class="btn">■ 停止</button>
      <button id="cutBtn" class="btn" title="選択中のクリップを再生位置でカット">✂ カット</button>
      <button id="deleteBtn" class="btn" title="選択中のクリップを削除">🗑 削除</button>
      <button id="clearUploadsBtn" class="btn" title="サーバーに保存されている音源ファイルを全て削除します">🧹 音源を全削除</button>
      <span class="spacer"></span>
      <select id="formatSelect" class="select">
        <option value="wav">WAV</option>
        <option value="mp3">MP3</option>
      </select>
      <button id="exportBtn" class="btn primary">⬇ 書き出し(結合)</button>
    </div>
  </header>

  <div class="collab-bar" id="collabBar">
    <div class="collab-info">
      <span id="myRoleBadge" class="role-badge"></span>
      <span id="editorInfo" class="editor-info"></span>
    </div>
    <div class="collab-actions" id="collabActions"></div>
  </div>

  <main class="editor">
    <div class="workspace" id="workspace">
      <div id="status" class="status"></div>
      <div class="workspace-body">
        <div class="ruler-wrap">
          <div class="track-labels-spacer"></div>
          <div id="ruler" class="ruler"></div>
        </div>
        <div id="tracksContainer" class="tracks-container">
          <div class="empty-hint" id="emptyHint">
            「+ ファイルを追加」から音声ファイルを選ぶと、ここに新しいトラックが追加されます。<br>
            クリップはドラッグで移動、端をドラッグでトリミング、再生ヘッド位置で「カット」できます。
          </div>
        </div>
      </div>
    </div>
  </main>

  <audio id="hiddenAudio" hidden></audio>

  <!-- 共同編集(オンライン編集)への参加モーダル。名前を入力するまで操作できない -->
  <div class="modal-overlay" id="joinModal">
    <div class="modal">
      <h2>🎚️ 共同編集に参加</h2>
      <p>表示する名前を入力してください。最初に参加した人がホストになります。</p>
      <input type="text" id="joinNameInput" maxlength="20" placeholder="例: たろう" autocomplete="off">
      <button id="joinBtn" class="btn primary">参加する</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
